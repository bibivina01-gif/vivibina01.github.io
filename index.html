<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ARCH 사원증 메이커</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&family=Noto+Serif+KR:wght@300;400;700&family=Playfair+Display:wght@700&family=Cinzel:wght@700&family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
<style>
    :root {
        /* 앞면 전용 색상 변수 */
        --bg-color-front: #ffffff;
        --border-color-front: #cfd4db;
        --theme-color-front: #a0a5aa; 
        --logo-color-front: #4a4d52;
        --name-color-front: #111111;
        --rank-color-front: #666666;
        --bottom-text-color-front: #ffffff;

        /* 뒷면 전용 색상 변수 */
        --bg-color-back: #ffffff;
        --border-color-back: #cfd4db;
        --theme-color-back: #a0a5aa; 
        --logo-color-back: #4a4d52;
        --name-color-back: #111111;
        --rank-color-back: #666666;
        --bottom-text-color-back: #ffffff;
    }

    #cardFront {
        --bg-color: var(--bg-color-front);
        --border-color: var(--border-color-front);
        --theme-color: var(--theme-color-front);
        --logo-color: var(--logo-color-front);
        --name-color: var(--name-color-front);
        --rank-color: var(--rank-color-front);
        --bottom-text-color: var(--bottom-text-color-front);
    }

    #cardBack {
        --bg-color: var(--bg-color-back);
        --border-color: var(--border-color-back);
        --theme-color: var(--theme-color-back);
        --logo-color: var(--logo-color-back);
        --name-color: var(--name-color-back);
        --rank-color: var(--rank-color-back);
        --bottom-text-color: var(--bottom-text-color-back);
    }

    /* ★ PC 기본 레이아웃 ★ */
    body {
        display: flex; flex-direction: row; min-height: 100vh;
        background-color: #e9ecef; font-family: 'Noto Sans KR', sans-serif; 
        margin: 0; padding: 0; 
    }

    .setup-panel {
        background: white; padding: 25px 30px; box-shadow: 2px 0 15px rgba(0,0,0,0.1); 
        width: 520px; height: 100vh; overflow-y: auto; box-sizing: border-box;
        display: flex; flex-direction: column; gap: 15px; z-index: 10;
    }

    .canvas-container {
        flex: 1; display: flex; justify-content: center; align-items: center;
        overflow: auto; padding: 20px;
    }

    #mobileScaleWrapper {
        display: flex; justify-content: center; align-items: center; width: 100%;
    }

    .control-group { display: flex; flex-direction: column; gap: 8px; }
    .control-group label.title { font-size: 14px; font-weight: 800; color: #333; }

    select.custom-select {
        padding: 8px; border: 1px solid #ced4da; border-radius: 6px;
        font-size: 16px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; 
    }

    .color-grid {
        display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
        background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #eee;
    }
    .color-item { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .color-item label { font-size: 11px; font-weight: bold; color: #555; white-space: nowrap; }

    .selectable-text { cursor: pointer; transition: outline 0.1s; }
    .selected-text { outline: 2px dashed #0984e3 !important; outline-offset: 4px; border-radius: 2px; }

    .text-edit-panel { background: #f1f3f5; padding: 15px; border-radius: 8px; margin-top: 5px; display: flex; flex-direction: column; gap: 10px; }
    .slider-row { display: flex; align-items: center; gap: 10px; }
    .slider-row span.label { font-size: 12px; font-weight: bold; width: 45px; color: #444; }
    .slider-row span.value { font-size: 11px; width: 30px; text-align: right; color: #666; }

    .sticker-edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #eee; }
    .sticker-container { max-height: 140px; overflow-y: auto; border: 1px solid #dee2e6; border-radius: 8px; padding: 10px; background: #f8f9fa; }
    .sticker-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
    .sticker-buttons button, .custom-sticker-label {
        padding: 5px 8px; background-color: #ffffff; border: 1px solid #ced4da; border-radius: 6px;
        font-size: 18px; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; color: #333; 
    }
    .sticker-buttons button:hover, .custom-sticker-label:hover { background-color: #e2e6ea; transform: scale(1.1); }
    .custom-sticker-label { font-size: 13px; font-weight: bold; padding: 5px 12px; }

    input[type="range"] { flex: 1; cursor: pointer; }
    input[type="color"] { width: 100%; height: 30px; border: none; border-radius: 4px; padding: 0; cursor: pointer; }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 1px solid #ddd; border-radius: 4px; }
    input[type="file"], button { cursor: pointer; }

    .save-btn {
        padding: 16px; background-color: #4a4d52; color: white; border: none; border-radius: 8px;
        font-size: 16px; font-weight: bold; transition: 0.2s; margin-top: 15px; margin-bottom: 20px;
    }
    .save-btn:hover { background-color: #1a252f; }
    .save-btn:disabled { background-color: #888; cursor: not-allowed; }

    .print-area {
        display: flex; flex-direction: row; gap: 30px; padding: 20px; background: transparent; position: relative;
    }

    .id-card {
        width: 280px; height: 440px; background-color: var(--bg-color); border-radius: 12px;
        position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        display: flex; flex-direction: column; align-items: center; border: 1.5px solid var(--border-color); flex-shrink: 0;
    }

    .card-face .logo { margin-top: 25px; font-size: 34px; font-weight: 900; color: var(--logo-color); letter-spacing: 1px; }
    .card-face .photo-wrapper {
        margin-top: 15px; width: 170px; height: 210px; border: 2px solid var(--theme-color-front);
        padding: 3px; box-sizing: border-box; background-color: var(--bg-color); position: relative; overflow: hidden;
    }
    .card-face .photo-wrapper img { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #eee; }
    .card-face .info-text { margin-top: 15px; text-align: center; }
    .card-face .name { font-size: 26px; font-weight: 600; color: var(--name-color); letter-spacing: 5px; margin-bottom: 5px; }
    .card-face .rank { font-size: 14px; color: var(--rank-color); }
    .card-face .bottom-bar {
        position: absolute; bottom: 0; width: 100%; height: 35px; background-color: var(--theme-color-front);
        color: var(--bottom-text-color); display: flex; justify-content: center; align-items: center;
        font-size: 12px; font-weight: bold; letter-spacing: 1px;
    }

    .back-layout { display: flex; flex-direction: row; width: 100%; height: 100%; }
    .back-layout .side-bar { background-color: var(--theme-color-back); display: flex; justify-content: center; align-items: center; width: 60px; }
    .back-layout .side-text { transform: rotate(-90deg); white-space: nowrap; color: var(--bottom-text-color); font-size: 18px; font-weight: 600; }
    .back-layout .content { flex: 1; padding: 40px 20px; }
    .back-layout .content .notice { color: var(--theme-color-back); font-size: 14px; font-weight: bold; margin-bottom: 10px; }
    .back-layout .content p { font-size: 12px; color: var(--name-color); line-height: 1.8; margin: 0; opacity: 0.8; }

    .back-layout-center { display: flex; flex-direction: column; width: 100%; height: 100%; align-items: center; }
    .back-layout-center .top-bar { width: 60px; height: 240px; background-color: var(--theme-color-back); display: flex; justify-content: center; align-items: center; }
    .back-layout-center .top-text { transform: rotate(-90deg); white-space: nowrap; color: var(--bottom-text-color); font-size: 18px; font-weight: 600; }
    .back-layout-center .bottom-content { width: 100%; flex: 1; padding: 30px 40px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-start; }
    .back-layout-center .bottom-content .notice { color: var(--theme-color-back); font-size: 14px; font-weight: bold; margin-bottom: 10px; }
    .back-layout-center .bottom-content p { font-size: 12px; color: var(--name-color); line-height: 1.8; margin: 0; opacity: 0.8; }

    .drag-sticker {
        position: absolute; cursor: grab; user-select: none; touch-action: none;
        z-index: 999; font-size: 35px; transition: filter 0.1s, transform 0.1s; 
    }
    .drag-sticker:active { cursor: grabbing; }
    .drag-sticker img { width: 80px; height: auto; pointer-events: none; }
    .selected-sticker { border: 2px dashed #ff4757 !important; box-sizing: content-box; border-radius: 8px; }

    @media screen and (max-width: 900px) {
        body { flex-direction: column !important; }
        .setup-panel { 
            width: 100% !important; height: 45vh !important; 
            border-bottom: 2px solid #ddd; padding: 15px 20px; 
            order: 1 !important; 
        }
        .canvas-container { 
            width: 100% !important; height: 55vh !important; 
            padding: 10px 0 !important; align-items: flex-start !important; 
            order: 2 !important; 
        }
        #mobileScaleWrapper {
            transform: scale(0.55); 
            transform-origin: top center;
        }
        .print-area { 
            flex-direction: row !important; 
            gap: 20px !important; 
        }
    }
</style>
</head>
<body>

<div class="setup-panel">
    <div class="control-group">
        <label class="title">✨ 전체 폰트 및 개별 글씨 설정</label>
        <select id="fontSelect" class="custom-select">
            <option value="'Noto Sans KR', sans-serif">Noto Sans KR (고딕)</option>
            <option value="'Noto Serif KR', serif">Noto Serif KR (명조)</option>
            <option value="'Playfair Display', serif">Playfair Display</option>
            <option value="'Cinzel', serif">Cinzel</option>
            <option value="'Galmuri9', sans-serif">Galmuri9 (비트/픽셀)</option>
            <option value="'Jua', sans-serif">Jua (귀여움 1)</option>
            <option value="'Gaegu', cursive">Gaegu (귀여움 2)</option>
        </select>
        
        <div class="text-edit-panel">
            <label style="font-size:11px; color:#555;">👆 오른쪽 사원증에서 변경할 <b>글씨를 클릭</b>하세요!</label>
            <div class="slider-row"><span class="label">크기</span><input type="range" id="textSizeInput" min="8" max="60" value="14" disabled><span class="value" id="textSizeDisplay">-</span></div>
            <div class="slider-row"><span class="label">굵기</span><input type="range" id="textWeightInput" min="100" max="900" step="100" value="400" disabled><span class="value" id="textWeightDisplay">-</span></div>
        </div>
    </div>

    <hr style="border:0; border-top:1px solid #eee;">

    <div class="control-group">
        <label class="title">🔄 뒷면 디자인 타입</label>
        <select id="backTypeSelect" class="custom-select">
            <option value="type-1">타입 1: 기본 (왼쪽 텍스트 바)</option>
            <option value="type-2">타입 2: 윗면과 동일 형태 (사진 별도)</option>
            <option value="type-3">타입 3: 상단 중앙 바 (사진 모양)</option>
        </select>
    </div>

    <hr style="border:0; border-top:1px solid #eee;">

    <div class="control-group">
        <label class="title">📷 사진 올리기</label>
        <div style="display:flex; flex-direction:column; gap:10px; background:#f8f9fa; padding:12px; border-radius:8px; border:1px solid #eee;">
            <div><label style="font-size:12px; font-weight:bold; display:block; margin-bottom:4px;">▶ 앞면 사진</label><input type="file" id="photoInputFront" accept="image/*"></div>
            <div id="backPhotoUploadContainer" style="display:none; padding-top:10px; border-top:1px dashed #ccc;">
                <label style="font-size:12px; font-weight:bold; color:#0984e3; display:block; margin-bottom:4px;">▶ 뒷면 사진 (타입 2 전용)</label>
                <input type="file" id="photoInputBack" accept="image/*">
            </div>
        </div>
    </div>

    <hr style="border:0; border-top:1px solid #eee;">

    <div class="control-group">
        <label class="title" style="color:#0984e3;">🎨 앞면 색상 설정</label>
        <div class="color-grid">
            <div class="color-item"><label>바탕</label><input type="color" id="bgColorFront" value="#ffffff"></div>
            <div class="color-item"><label>테두리</label><input type="color" id="borderColorFront" value="#cfd4db"></div>
            <div class="color-item"><label>포인트</label><input type="color" id="themeColorFront" value="#a0a5aa"></div>
            <div class="color-item"><label>로고</label><input type="color" id="logoColorFront" value="#4a4d52"></div>
            <div class="color-item"><label>이름</label><input type="color" id="nameColorFront" value="#111111"></div>
            <div class="color-item"><label>등급</label><input type="color" id="rankColorFront" value="#666666"></div>
            <div class="color-item"><label>바 글씨</label><input type="color" id="bottomTextColorFront" value="#ffffff"></div>
        </div>
    </div>

    <div class="control-group">
        <label class="title" style="color:#d63031;">🎨 뒷면 색상 설정</label>
        <div class="color-grid">
            <div class="color-item"><label>바탕</label><input type="color" id="bgColorBack" value="#ffffff"></div>
            <div class="color-item"><label>테두리</label><input type="color" id="borderColorBack" value="#cfd4db"></div>
            <div class="color-item"><label>포인트</label><input type="color" id="themeColorBack" value="#a0a5aa"></div>
            <div class="color-item"><label>로고</label><input type="color" id="logoColorBack" value="#4a4d52"></div>
            <div class="color-item"><label>이름</label><input type="color" id="nameColorBack" value="#111111"></div>
            <div class="color-item"><label>등급</label><input type="color" id="rankColorBack" value="#666666"></div>
            <div class="color-item"><label>바 글씨</label><input type="color" id="bottomTextColorBack" value="#ffffff"></div>
        </div>
    </div>
    
    <hr style="border:0; border-top:1px solid #eee;">

    <div class="control-group">
        <label class="title">🚀 스티커 상세 보정</label>
        <div class="sticker-edit-grid">
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <div class="slider-row"><span class="label">통합 크기</span><input type="range" id="stickerScale" min="10" max="300" value="100"></div>
                <div class="slider-row"><span class="label">너비반전</span><input type="range" id="stickerScaleX" min="-300" max="300" value="100"></div>
                <div class="slider-row"><span class="label">높이반전</span><input type="range" id="stickerScaleY" min="-300" max="300" value="100"></div>
                <div class="slider-row"><span class="label">회전각도</span><input type="range" id="stickerRotate" min="0" max="360" value="0"></div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <div class="slider-row"><span class="label">밝기</span><input type="range" id="stickerBrightness" min="0" max="200" value="100"></div>
                <div class="slider-row"><span class="label">색상변경</span><input type="range" id="stickerHue" min="0" max="360" value="0"></div>
                <div class="slider-row"><span class="label">투명도</span><input type="range" id="stickerOpacity" min="20" max="100" value="100"></div>
            </div>
        </div>
    </div>

    <div class="control-group" style="margin-top: 10px;">
        <label class="title">✨ 스티커 추가 (클릭 / 드래그 / 더블클릭 삭제)</label>
        <div class="sticker-container">
            <div class="sticker-buttons">
                <label class="custom-sticker-label">+ 내 사진 추가<input type="file" id="customStickerInput" accept="image/*" style="display:none;"></label>
                <script>
                    const emojis = ['🍋','💞','🐽','🐖','😇','💢','💘','🦴','🗨️','💋','👆','🪻','🍰','☁️','☀️','⚡','❄️','🍊','🍑','🌻','🧀','🍫','🎀','🕶️','🎵','🧸','🍓','👑','🪽','🐈‍⬛','🐈','🦊','🐶','😊','🐬','🐾','🐤','🐸','🫧','🍬','🍭','🐱','🦋','🥭','🍎','🐰','🌸','🌹','🌼','🌟','⭐','🌈','🔥','💧','🌿','🌪️','🧊','❤️','✨','🍒'];
                    emojis.forEach(e => document.write(`<button onclick="addEmojiSticker('${e}')">${e}</button>`));
                </script>
            </div>
        </div>
    </div>

    <button class="save-btn" id="saveActionBtn" onclick="saveCard()">사원증 이미지로 저장하기</button>
</div>

<div class="canvas-container">
    <div id="mobileScaleWrapper">
        <div class="print-area" id="idCardSet">
            <div class="id-card card-face" id="cardFront">
                <div class="logo selectable-text">ARCH</div>
                <div class="photo-wrapper"><img id="photoPreviewFront" src="" alt=""></div>
                <div class="info-text">
                    <div class="name selectable-text" contenteditable="true">NOBEL</div>
                    <div class="rank selectable-text" contenteditable="true"> S-불속성 센티넬 / 가이드</div>
                </div>
                <div class="bottom-bar selectable-text" contenteditable="true">HARMONY DIV.</div>
            </div>

            <div class="id-card" id="cardBack">
                <div class="back-layout type-1">
                    <div class="side-bar"><div class="side-text selectable-text" contenteditable="true">■ Kim cherry mango</div></div>
                    <div class="content">
                        <div class="notice selectable-text" contenteditable="true">| 주의사항</div>
                        <p class="selectable-text" contenteditable="true">사원증은 항상 소지해야 합니다.<br>타인에게 양도·대여할 수 없습니다.<br>분실 시 재발급을 받아야 합니다.<br><br></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const root = document.documentElement.style;
    const printArea = document.getElementById('idCardSet');
    let selectedSticker = null, selectedText = null; 
    let fPhoto = "", bPhoto = ""; // 사진 데이터 보관용

    document.getElementById('fontSelect').addEventListener('change', function(e) {
        printArea.style.fontFamily = e.target.value;
        this.style.fontFamily = e.target.value;
    });

    document.getElementById('backTypeSelect').addEventListener('change', function(e) {
        const type = e.target.value;
        const cardBack = document.getElementById('cardBack');
        const backPhotoUploadContainer = document.getElementById('backPhotoUploadContainer');
        clearSelections();

        if (type === 'type-1') {
            cardBack.className = 'id-card';
            cardBack.innerHTML = `<div class="back-layout type-1"><div class="side-bar"><div class="side-text selectable-text" contenteditable="true">■ Kim cherry mango</div></div><div class="content"><div class="notice selectable-text" contenteditable="true">| 주의사항</div><p class="selectable-text" contenteditable="true">사원증은 항상 소지해야 합니다.<br>타인에게 양도·대여할 수 없습니다.<br>분실 시 재발급을 받아야 합니다.<br><br></p></div></div>`;
            backPhotoUploadContainer.style.display = 'none';
        } else if (type === 'type-3') {
            cardBack.className = 'id-card';
            cardBack.innerHTML = `<div class="back-layout-center"><div class="top-bar"><div class="top-text selectable-text" contenteditable="true">■ Kim cherry mango</div></div><div class="bottom-content"><div class="notice selectable-text" contenteditable="true">| 주의사항</div><p class="selectable-text" contenteditable="true">사원증은 항상 소지해야 합니다.<br>타인에게 양도·대여할 수 없습니다.<br>분실 시 재발급을 받아야 합니다.<br><br></p></div></div>`;
            backPhotoUploadContainer.style.display = 'none';
        } else if (type === 'type-2') {
            cardBack.className = 'id-card card-face';
            cardBack.innerHTML = `<div class="logo selectable-text">ARCH</div><div class="photo-wrapper"><img id="photoPreviewBack" src="${bPhoto}"></div><div class="info-text"><div class="name selectable-text" contenteditable="true">NOBEL</div><div class="rank selectable-text" contenteditable="true"> S-불속성 센티넬 / 가이드</div></div><div class="bottom-bar selectable-text" contenteditable="true" style="background-color: var(--theme-color-back);">HARMONY DIV.</div>`;
            backPhotoUploadContainer.style.display = 'block';
            if(bPhoto) setTimeout(() => fitImage(document.getElementById('photoPreviewBack')), 10);
        }
    });

    const textSizeInput = document.getElementById('textSizeInput');
    const textWeightInput = document.getElementById('textWeightInput');

    textSizeInput.addEventListener('input', function(e) { if (selectedText) { selectedText.style.fontSize = e.target.value + 'px'; document.getElementById('textSizeDisplay').innerText = e.target.value; }});
    textWeightInput.addEventListener('input', function(e) { if (selectedText) { selectedText.style.fontWeight = e.target.value; document.getElementById('textWeightDisplay').innerText = e.target.value; }});

    function clearSelections() {
        if (selectedSticker) selectedSticker.classList.remove('selected-sticker');
        if (selectedText) selectedText.classList.remove('selected-text');
        selectedSticker = null; selectedText = null; textSizeInput.disabled = textWeightInput.disabled = true;
    }

    printArea.addEventListener('click', (e) => {
        const s = e.target.closest('.drag-sticker'), t = e.target.closest('.selectable-text');
        if(s || t) clearSelections();
        if (s) {
            selectedSticker = s; s.classList.add('selected-sticker');
            ['Scale','ScaleX','ScaleY','Rotate','Brightness','Hue','Opacity'].forEach(k => document.getElementById('sticker'+k).value = s.dataset[k.toLowerCase()] || 100);
        } else if (t) {
            selectedText = t; t.classList.add('selected-text');
            textSizeInput.value = parseInt(window.getComputedStyle(t).fontSize);
            textWeightInput.value = window.getComputedStyle(t).fontWeight;
            textSizeInput.disabled = textWeightInput.disabled = false;
        }
    });

    function fitImage(img) {
        if(!img || !img.src) return;
        const ratio = img.naturalWidth / img.naturalHeight;
        if (ratio > 170/210) { img.style.width = 'auto'; img.style.height = '100%'; } 
        else { img.style.width = '100%'; img.style.height = 'auto'; }
    }

    function processImage(file, targetId, isFront) {
        const reader = new FileReader();
        reader.onload = e => {
            const data = e.target.result;
            if(isFront) fPhoto = data; else bPhoto = data;
            const img = document.getElementById(targetId);
            if(img) { img.src = data; img.onload = () => fitImage(img); }
        };
        reader.readAsDataURL(file);
    }
    document.getElementById('photoInputFront').addEventListener('change', e => e.target.files[0] && processImage(e.target.files[0], 'photoPreviewFront', true));
    document.getElementById('photoInputBack').addEventListener('change', e => e.target.files[0] && processImage(e.target.files[0], 'photoPreviewBack', false));

    function updateSticker(el) {
        const s = el.dataset;
        const fx = (s.scale/100) * (s.scalex/100), fy = (s.scale/100) * (s.scaley/100);
        el.style.filter = `hue-rotate(${s.hue}deg) opacity(${s.opacity/100}) brightness(${s.brightness/100})`;
        el.style.transform = `rotate(${s.rotate}deg) scale(${fx}, ${fy})`;
    }
    ['Scale','ScaleX','ScaleY','Rotate','Brightness','Hue','Opacity'].forEach(id => {
        document.getElementById('sticker'+id).addEventListener('input', e => { if(selectedSticker) { selectedSticker.dataset[id.toLowerCase()] = e.target.value; updateSticker(selectedSticker); }});
    });

    function addEmojiSticker(emoji) {
        const s = document.createElement('div'); s.className = 'drag-sticker'; s.innerText = emoji;
        s.style.left = '100px'; s.style.top = '100px';
        ['scale','scalex','scaley','rotate','hue','opacity','brightness'].forEach(k => s.dataset[k] = k==='rotate'||k==='hue'?0:100);
        s.ondblclick = () => s.remove(); printArea.appendChild(s); makeDraggable(s);
    }
    document.getElementById('customStickerInput').addEventListener('change', function(e) {
        if(!e.target.files[0]) return;
        const reader = new FileReader();
        reader.onload = ev => {
            const s = document.createElement('div'); s.className = 'drag-sticker'; s.innerHTML = `<img src="${ev.target.result}">`;
            ['scale','scalex','scaley','rotate','hue','opacity','brightness'].forEach(k => s.dataset[k] = k==='rotate'||k==='hue'?0:100);
            s.ondblclick = () => s.remove(); printArea.appendChild(s); makeDraggable(s);
        };
        reader.readAsDataURL(e.target.files[0]);
    });

    function makeDraggable(el) {
        let p1=0,p2=0,p3=0,p4=0;
        el.onmousedown = el.ontouchstart = e => {
            const ev = e.touches ? e.touches[0] : e; p3 = ev.clientX; p4 = ev.clientY;
            document.onmousemove = document.ontouchmove = e => {
                const ev2 = e.touches ? e.touches[0] : e;
                const factor = window.innerWidth <= 900 ? 0.55 : 1;
                p1 = (p3 - ev2.clientX)/factor; p2 = (p4 - ev2.clientY)/factor;
                p3 = ev2.clientX; p4 = ev2.clientY;
                el.style.top = (el.offsetTop - p2) + "px"; el.style.left = (el.offsetLeft - p1) + "px";
            };
            document.onmouseup = document.ontouchend = () => document.onmousemove = document.ontouchmove = null;
        };
    }

    const colorIds = ['bgColorFront','borderColorFront','themeColorFront','logoColorFront','nameColorFront','rankColorFront','bottomTextColorFront','bgColorBack','borderColorBack','themeColorBack','logoColorBack','nameColorBack','rankColorBack','bottomTextColorBack'];
    colorIds.forEach(id => document.getElementById(id).addEventListener('input', e => root.setProperty('--'+id.replace(/[A-Z]/g, m=>'-'+m.toLowerCase()), e.target.value)));

    // ★ 모바일 저장 오류 해결 (Two-Pass 렌더링 적용) ★
    function saveCard() {
        clearSelections();
        const wrapper = document.getElementById('mobileScaleWrapper');
        const isMobile = window.innerWidth <= 900;
        if(isMobile) wrapper.style.transform = 'scale(1)';

        setTimeout(() => {
            const options = { pixelRatio: 3, cacheBust: true, useCORS: true };
            // 모바일 이미지 증발 방지를 위해 빈 캡처 1회 선행 후 진짜 캡처 실행
            htmlToImage.toPng(printArea, options)
                .then(() => htmlToImage.toPng(printArea, options))
                .then(dataUrl => {
                    if(isMobile) wrapper.style.transform = 'scale(0.55)';
                    const link = document.createElement('a');
                    link.download = 'ARCH_ID.png'; link.href = dataUrl; link.click();
                })
                .catch(() => {
                    if(isMobile) wrapper.style.transform = 'scale(0.55)';
                    alert("저장 중 오류가 발생했습니다.");
                });
        }, 300);
    }
</script>
