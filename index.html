<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>ARCH 사원증 메이커</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
<style>
    :root {
        /* 기본 색상 설정 */
        --theme-color: #a0a5aa; 
        --logo-color: #4a4d52;
        --name-color: #111111;
        --rank-color: #666666;
        --bottom-text-color: #ffffff;
        --bg-color: #ffffff;
        --border-color: #cfd4db;
    }

    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        background-color: #e9ecef;
        font-family: 'Pretendard', sans-serif;
        margin: 0;
        padding: 40px 20px;
    }

    /* 설정 패널 */
    .setup-panel {
        background: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        margin-bottom: 30px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 15px;
        width: 100%;
        max-width: 950px;
    }

    .control-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .control-group label {
        font-size: 13px;
        font-weight: bold;
        color: #444;
    }

    /* 스티커 버튼 영역 스타일 */
    .sticker-container {
        max-height: 130px; 
        overflow-y: auto; 
        border: 1px solid #dee2e6;
        border-radius: 8px;
        padding: 10px;
        background: #f8f9fa;
    }
    
    .sticker-buttons {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
    }
    .sticker-buttons button, .custom-sticker-label {
        padding: 5px 8px;
        background-color: #ffffff;
        border: 1px solid #ced4da;
        border-radius: 6px;
        font-size: 18px;
        cursor: pointer;
        transition: 0.2s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #333; 
    }
    .sticker-buttons button:hover, .custom-sticker-label:hover {
        background-color: #e2e6ea;
        transform: scale(1.1);
    }
    /* '+ 내 사진 추가' 버튼 스타일 */
    .custom-sticker-label {
        font-size: 13px;
        font-weight: bold;
        background-color: #ffffff; 
        color: #2c3e50; 
        border: 1px solid #ced4da; 
        padding: 5px 12px;
    }
    .custom-sticker-label:hover {
        background-color: #e9ecef; 
        color: #1a252f; 
    }

    /* 슬라이더 스타일 */
    input[type="range"] {
        width: 100%;
        cursor: pointer;
    }

    input[type="color"] {
        width: 100%;
        height: 38px;
        border: none;
        border-radius: 6px;
        padding: 0;
        cursor: pointer;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 1px solid #ddd; border-radius: 6px; }
    
    input[type="file"], button { cursor: pointer; }

    .save-btn {
        padding: 14px;
        background-color: #4a4d52;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: bold;
        transition: 0.2s;
        grid-column: 1 / -1; 
        margin-top: 15px;
    }
    .save-btn:hover { background-color: #1a252f; }

    /* 사원증 출력 영역 */
    .print-area {
        display: flex;
        gap: 30px;
        padding: 20px;
        background: transparent;
        position: relative;
    }

    .id-card {
        width: 280px;
        height: 440px;
        background-color: var(--bg-color);
        border-radius: 12px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        display: flex;
        flex-direction: column;
        align-items: center;
        border: 1.5px solid var(--border-color);
    }

    /* 앞면 디자인 */
    .front .logo {
        margin-top: 25px;
        font-family: 'Montserrat', sans-serif;
        font-size: 34px;
        font-weight: 900; 
        color: var(--logo-color);
        letter-spacing: 1px;
    }

    .front .photo-wrapper {
        margin-top: 15px;
        width: 170px;
        height: 210px;
        border: 2px solid var(--theme-color);
        padding: 3px;
        box-sizing: border-box;
        background-color: var(--bg-color);
        position: relative;
        overflow: hidden;
    }

    .front .photo-wrapper img {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #eee;
    }

    .front .info-text {
        margin-top: 15px;
        text-align: center;
    }

    .front .name {
        font-size: 26px;
        font-weight: 600;
        color: var(--name-color);
        letter-spacing: 5px;
        margin-bottom: 5px;
    }

    .front .rank {
        font-size: 14px;
        color: var(--rank-color);
    }

    .front .bottom-bar {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 35px;
        background-color: var(--theme-color);
        color: var(--bottom-text-color);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 1px;
    }

    /* 뒷면 디자인 */
    .back { display: flex; }
    .back .side-bar {
        width: 60px;
        height: 100%;
        background-color: var(--theme-color);
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .back .side-text {
        transform: rotate(-90deg);
        white-space: nowrap;
        color: var(--bottom-text-color);
        font-size: 18px; 
        font-weight: 600;
    }
    .back .content {
        flex: 1;
        padding: 40px 20px;
    }
    .back .content .notice {
        color: var(--theme-color);
        font-size: 14px; 
        font-weight: bold;
        margin-bottom: 10px;
    }
    .back .content p { font-size: 12px; color: var(--name-color); line-height: 1.8; margin: 0; opacity: 0.8; }

    /* 드래그 가능한 스티커 스타일 */
    .drag-sticker {
        position: absolute;
        cursor: grab;
        user-select: none;
        z-index: 999; 
        font-size: 35px; 
        title: "더블클릭하면 삭제됩니다!";
        transition: filter 0.1s, transform 0.1s; 
    }
    .drag-sticker:active { cursor: grabbing; }
    .drag-sticker img {
        width: 80px; 
        height: auto;
        pointer-events: none; 
    }
    /* 선택된 스티커 스타일 추가 */
    .selected-sticker {
        border: 2px dashed #ff4757 !important; 
        box-sizing: content-box; 
        border-radius: 8px;
    }
</style>
</head>
<body>

<div class="setup-panel">
    <div class="control-group">
        <label>1. 사진 올리기</label>
        <input type="file" id="photoInput" accept="image/*">
    </div>
    <div class="control-group">
        <label>2. 바탕 색상</label>
        <input type="color" id="bgColor" value="#ffffff">
    </div>

        <input type="color" id="borderColor" value="#cfd4db">

    <div class="control-group">

        <input type="color" id="themeColor" value="#a0a5aa">
    </div>
    <div class="control-group">
        <label>5. 로고 색상</label>
        <input type="color" id="logoColor" value="#4a4d52">

    </div>

        <label>7. 등급 색상</label>

    <div class="control-group">
        <label>8. 바 글씨 색상</label>
        <input type="color" id="bottomTextColor" value="#ffffff">
    </div>
    
    <div class="control-group" style="grid-column: 1 / -1;">
        <label>9. 선택된 스티커 상세 보정 (자유 변형)</label>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 5px;">
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <div style="display: flex; align-items: center; gap: 5px;">
                    <span style="font-size: 11px; width: 60px;">너비(반전)</span>
                    <input type="range" id="stickerScaleX" min="-300" max="300" value="100">
                </div>
                <div style="display: flex; align-items: center; gap: 5px;">
                    <span style="font-size: 11px; width: 60px;">높이(반전)</span>
                    <input type="range" id="stickerScaleY" min="-300" max="300" value="100">
                </div>
                <div style="display: flex; align-items: center; gap: 5px;">
                    <span style="font-size: 11px; width: 60px;">회전각도</span>
                    <input type="range" id="stickerRotate" min="0" max="360" value="0">
                </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <div style="display: flex; align-items: center; gap: 5px;">
                    <span style="font-size: 11px; width: 40px;">밝기</span>
                    <input type="range" id="stickerBrightness" min="0" max="200" value="100">
                </div>
                <div style="display: flex; align-items: center; gap: 5px;">
                    <span style="font-size: 11px; width: 40px;">색상</span>
                    <input type="range" id="stickerHue" min="0" max="360" value="0">
                </div>
                <div style="display: flex; align-items: center; gap: 5px;">
                    <span style="font-size: 11px; width: 40px;">투명도</span>
                    <input type="range" id="stickerOpacity" min="20" max="100" value="100">
                </div>
            </div>
        </div>
    </div>

    <div class="control-group" style="grid-column: 1 / -1;">
        <label>10. 스티커 추가 및 꾸미기 (클릭 선택 / 드래그 이동 / 더블클릭 삭제)</label>
        <div class="sticker-container">
            <div class="sticker-buttons">
                <label class="custom-sticker-label">
                    + 내 사진 추가
                    <input type="file" id="customStickerInput" accept="image/*" style="display:none;">
                </label>
                <button onclick="addEmojiSticker('🍋')">🍋</button>
                <button onclick="addEmojiSticker('👻')">👻</button>
                <button onclick="addEmojiSticker('💞')">💞</button>
                <button onclick="addEmojiSticker('🐽')">🐽</button>
                <button onclick="addEmojiSticker('🐖')">🐖</button>
                <button onclick="addEmojiSticker('😇')">😇</button>
                <button onclick="addEmojiSticker('💢')">💢</button>
                <button onclick="addEmojiSticker('💘')">💘</button>
                <button onclick="addEmojiSticker('🦴')">🦴</button>
                <button onclick="addEmojiSticker('🗨️')">🗨️</button>
                <button onclick="addEmojiSticker('💋')">💋</button>
                <button onclick="addEmojiSticker('👆')">👆</button>
                <button onclick="addEmojiSticker('🪻')">🪻</button>
                <button onclick="addEmojiSticker('🍰')">🍰</button>
                <button onclick="addEmojiSticker('☁️')">☁️</button>
                <button onclick="addEmojiSticker('🌙')">🌙</button>
                <button onclick="addEmojiSticker('☀️')">☀️</button>
                <button onclick="addEmojiSticker('⚡')">⚡</button>
                <button onclick="addEmojiSticker('❄️')">❄️</button>
                <button onclick="addEmojiSticker('🍊')">🍊</button>
                <button onclick="addEmojiSticker('🍑')">🍑</button>
                <button onclick="addEmojiSticker('🌻')">🌻</button>
                <button onclick="addEmojiSticker('🧀')">🧀</button>
                <button onclick="addEmojiSticker('🍫')">🍫</button>
                <button onclick="addEmojiSticker('🎀')">🎀</button>
                <button onclick="addEmojiSticker('🕶️')">🕶️</button>
                <button onclick="addEmojiSticker('🎵')">🎵</button>
                <button onclick="addEmojiSticker('🧸')">🧸</button>
                <button onclick="addEmojiSticker('🍓')">🍓</button>
                <button onclick="addEmojiSticker('👑')">👑</button>
                <button onclick="addEmojiSticker('🪽')">🪽</button>
                <button onclick="addEmojiSticker('🐈‍⬛')">🐈‍⬛</button>
                <button onclick="addEmojiSticker('🐈')">🐈</button>
                <button onclick="addEmojiSticker('🦊')">🦊</button>
                <button onclick="addEmojiSticker('🐶')">🐶</button>
                <button onclick="addEmojiSticker('😊')">😊</button>
                <button onclick="addEmojiSticker('🐬')">🐬</button>
                <button onclick="addEmojiSticker('🐾')">🐾</button>
                <button onclick="addEmojiSticker('🐤')">🐤</button>
                <button onclick="addEmojiSticker('🐸')">🐸</button>
                <button onclick="addEmojiSticker('🫧')">🫧</button>
                <button onclick="addEmojiSticker('🍬')">🍬</button>
                <button onclick="addEmojiSticker('🍭')">🍭</button>
                <button onclick="addEmojiSticker('🐱')">🐱</button>
                <button onclick="addEmojiSticker('🦋')">🦋</button>
                <button onclick="addEmojiSticker('🥭')">🥭</button>
                <button onclick="addEmojiSticker('🍎')">🍎</button>
                <button onclick="addEmojiSticker('🐰')">🐰</button>
                <button onclick="addEmojiSticker('🌸')">🌸</button>
                <button onclick="addEmojiSticker('🌹')">🌹</button>
                <button onclick="addEmojiSticker('🌼')">🌼</button>
                <button onclick="addEmojiSticker('🌟')">🌟</button>
                <button onclick="addEmojiSticker('⭐')">⭐</button>
                <button onclick="addEmojiSticker('🌈')">🌈</button>
                <button onclick="addEmojiSticker('🔥')">🔥</button>
                <button onclick="addEmojiSticker('💧')">💧</button>
                <button onclick="addEmojiSticker('🌿')">🌿</button>
                <button onclick="addEmojiSticker('🌪️')">🌪️</button>
                <button onclick="addEmojiSticker('🧊')">🧊</button>
                <button onclick="addEmojiSticker('❤️')">❤️</button>
                <button onclick="addEmojiSticker('✨')">✨</button>
                <button onclick="addEmojiSticker('🍒')">🍒</button>

            </div>
        </div>
    </div>

    <button class="save-btn" onclick="saveCard()">사원증 이미지로 저장하기</button>
</div>

<div class="print-area" id="idCardSet">
    <div class="id-card front" id="cardFront">
        <div class="logo">ARCH</div>
        <div class="photo-wrapper">
            <img id="photoPreview" src="" alt="">
        </div>
        <div class="info-text">
            <div class="name" contenteditable="true">NOBEL</div>
            <div class="rank" contenteditable="true"> S-불속성 센티넬 / 가이드</div>
        </div>
        <div class="bottom-bar" contenteditable="true">HARMONY DIV.</div>
    </div>

    <div class="id-card back" id="cardBack">
        <div class="side-bar">
            <div class="side-text" contenteditable="true">■ Kim cherry mango</div>
        </div>
        <div class="content">
            <div class="notice" contenteditable="true">| 주의사항</div>
            <p contenteditable="true">
                사원증은 항상 소지해야 합니다.<br>
                타인에게 양도·대여할 수 없습니다.<br>
                분실 시 재발급을 받아야 합니다.<br><br>
            </p>
        </div>
    </div>
</div>

<script>
    const root = document.documentElement.style;
    const printArea = document.getElementById('idCardSet');
    let selectedSticker = null; 

    // ★ 스티커 상태 업데이트 전용 함수 (자유변형 완벽 지원) ★
    function updateStickerStyle(sticker) {
        const hue = sticker.dataset.hue || "0";
        const opacity = (sticker.dataset.opacity || "100") / 100;
        const brightness = (sticker.dataset.brightness || "100") / 100;
        const scaleX = (sticker.dataset.scaleX || "100") / 100;
        const scaleY = (sticker.dataset.scaleY || "100") / 100;
        const rotate = sticker.dataset.rotate || "0";

        sticker.style.filter = `hue-rotate(${hue}deg) opacity(${opacity}) brightness(${brightness})`;
        // 회전과 크기 반전, 늘리기를 자유롭게 적용합니다.
        sticker.style.transform = `rotate(${rotate}deg) scale(${scaleX}, ${scaleY})`;
    }

    // 1. 스티커 클릭 선택 기능
    printArea.addEventListener('click', (e) => {
        const clickedSticker = e.target.closest('.drag-sticker');

        if (clickedSticker) {
            if (selectedSticker && selectedSticker !== clickedSticker) {
                selectedSticker.classList.remove('selected-sticker');
            }
            selectedSticker = clickedSticker;
            selectedSticker.classList.add('selected-sticker');

            // 스티커가 가진 고유 데이터를 모든 슬라이더에 동기화
            document.getElementById('stickerHue').value = selectedSticker.dataset.hue || 0;
            document.getElementById('stickerOpacity').value = selectedSticker.dataset.opacity || 100;
            document.getElementById('stickerBrightness').value = selectedSticker.dataset.brightness || 100;
            document.getElementById('stickerScaleX').value = selectedSticker.dataset.scaleX || 100;
            document.getElementById('stickerScaleY').value = selectedSticker.dataset.scaleY || 100;
            document.getElementById('stickerRotate').value = selectedSticker.dataset.rotate || 0;
            
        } else if (selectedSticker) {
            selectedSticker.classList.remove('selected-sticker');
            selectedSticker = null;
        }
    });

    // 2. 6개의 모든 조절바 이벤트 (데이터셋 동기화)
    document.getElementById('stickerScaleX').addEventListener('input', (e) => {
        if (selectedSticker) {
            selectedSticker.dataset.scaleX = e.target.value;
            updateStickerStyle(selectedSticker);
        }
    });
    
    document.getElementById('stickerScaleY').addEventListener('input', (e) => {
        if (selectedSticker) {
            selectedSticker.dataset.scaleY = e.target.value;
            updateStickerStyle(selectedSticker);
        }
    });
    
    document.getElementById('stickerRotate').addEventListener('input', (e) => {
        if (selectedSticker) {
            selectedSticker.dataset.rotate = e.target.value;
            updateStickerStyle(selectedSticker);
        }
    });

    document.getElementById('stickerHue').addEventListener('input', (e) => {
        if (selectedSticker) {
            selectedSticker.dataset.hue = e.target.value;
            updateStickerStyle(selectedSticker);
        }
    });
    
    document.getElementById('stickerOpacity').addEventListener('input', (e) => {
        if (selectedSticker) {
            selectedSticker.dataset.opacity = e.target.value;
            updateStickerStyle(selectedSticker);
        }
    });

    document.getElementById('stickerBrightness').addEventListener('input', (e) => {
        if (selectedSticker) {
            selectedSticker.dataset.brightness = e.target.value;
            updateStickerStyle(selectedSticker);
        }
    });

    // --- 기본 사진 업로드 스크립트 ---
    document.getElementById('photoInput').addEventListener('change', function(e) {
        if(e.target.files[0]) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = document.getElementById('photoPreview');
                img.onload = function() {
                    const wrapperRatio = 164 / 204;
                    const imgRatio = img.naturalWidth / img.naturalHeight;
                    if (imgRatio > wrapperRatio) {
                        img.style.width = 'auto';
                        img.style.height = '100%';
                    } else {
                        img.style.width = '100%';
                        img.style.height = 'auto';
                    }
                };
                img.src = event.target.result;
            }
            reader.readAsDataURL(e.target.files[0]);
        }
    });

    // --- 색상 변경 스크립트 ---
    const colorInputs = [
        { id: 'bgColor', variable: '--bg-color' },
        { id: 'borderColor', variable: '--border-color' },
        { id: 'themeColor', variable: '--theme-color' },
        { id: 'logoColor', variable: '--logo-color' },
        { id: 'nameColor', variable: '--name-color' },
        { id: 'rankColor', variable: '--rank-color' },
        { id: 'bottomTextColor', variable: '--bottom-text-color' }
    ];
    colorInputs.forEach(item => {
        document.getElementById(item.id).addEventListener('input', (e) => {
            root.setProperty(item.variable, e.target.value);
        });
    });

    // --- 스티커 추가 기능 (데이터셋 초기화) ---
    function addEmojiSticker(emoji) {
        const sticker = document.createElement('div');
        sticker.className = 'drag-sticker';
        sticker.innerText = emoji;
        sticker.title = "더블클릭하여 삭제";
        
        sticker.style.left = '100px';
        sticker.style.top = '100px';
        
        // 스티커 데이터 초기값 완벽 세팅
        sticker.dataset.hue = "0";
        sticker.dataset.opacity = "100";
        sticker.dataset.brightness = "100";
        sticker.dataset.scaleX = "100";
        sticker.dataset.scaleY = "100";
        sticker.dataset.rotate = "0";
        updateStickerStyle(sticker);
        
        sticker.ondblclick = function() { sticker.remove(); };
        printArea.appendChild(sticker);
        makeDraggable(sticker);
    }

    // 커스텀(내 사진) 스티커 추가 (데이터셋 초기화)
    document.getElementById('customStickerInput').addEventListener('change', function(e) {
        if(e.target.files[0]) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const sticker = document.createElement('div');
                sticker.className = 'drag-sticker';
                sticker.title = "더블클릭하여 삭제";

                const img = document.createElement('img');
                img.src = event.target.result;
                sticker.appendChild(img);
                
                sticker.style.left = '100px';
                sticker.style.top = '100px';
                
                // 스티커 데이터 초기값 완벽 세팅
                sticker.dataset.hue = "0";
                sticker.dataset.opacity = "100";
                sticker.dataset.brightness = "100";
                sticker.dataset.scaleX = "100";
                sticker.dataset.scaleY = "100";
                sticker.dataset.rotate = "0";
                updateStickerStyle(sticker);
                
                sticker.ondblclick = function() { sticker.remove(); };

                printArea.appendChild(sticker);
                makeDraggable(sticker);
            }
            reader.readAsDataURL(e.target.files[0]);
            e.target.value = ''; 
        }
    });

    // --- 스티커 드래그 이동 기능 (모바일 완벽 호환) ---
    function makeDraggable(elmnt) {
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        
        elmnt.onmousedown = dragMouseDown;
        elmnt.ontouchstart = dragMouseDown; 

        function dragMouseDown(e) {
            e = e || window.event;
            
            if (selectedSticker && selectedSticker !== elmnt) {
                selectedSticker.classList.remove('selected-sticker');
            }
            selectedSticker = elmnt;
            selectedSticker.classList.add('selected-sticker');

            // 6개 슬라이더 데이터 동기화
            document.getElementById('stickerHue').value = selectedSticker.dataset.hue || 0;
            document.getElementById('stickerOpacity').value = selectedSticker.dataset.opacity || 100;
            document.getElementById('stickerBrightness').value = selectedSticker.dataset.brightness || 100;
            document.getElementById('stickerScaleX').value = selectedSticker.dataset.scaleX || 100;
            document.getElementById('stickerScaleY').value = selectedSticker.dataset.scaleY || 100;
            document.getElementById('stickerRotate').value = selectedSticker.dataset.rotate || 0;

            if(e.type === 'touchstart') {
                pos3 = e.touches[0].clientX;
                pos4 = e.touches[0].clientY;
            } else {
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
            }
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
            document.ontouchend = closeDragElement;
            document.ontouchmove = elementDrag;
        }

        function elementDrag(e) {
            e = e || window.event;
            if(e.type !== 'touchmove') e.preventDefault();
            
            let clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
            let clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;

            pos1 = pos3 - clientX;
            pos2 = pos4 - clientY;
            pos3 = clientX;
            pos4 = clientY;
            
            elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
            elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
        }

        function closeDragElement() {
            document.onmouseup = null;
            document.onmousemove = null;
            document.ontouchend = null;
            document.ontouchmove = null;
        }
    }

    // --- 캡처 및 저장 기능 ---
    function saveCard() {
        if (selectedSticker) {
            selectedSticker.classList.remove('selected-sticker');
            selectedSticker = null;
        }

        const area = document.getElementById('idCardSet');
        
        htmlToImage.toPng(area, { pixelRatio: 3 })
            .then(function (dataUrl) {
                const link = document.createElement('a');
                link.download = 'ARCH_사원증.png';
                link.href = dataUrl;
                link.click();
            })
            .catch(function (error) {
                alert("저장 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요!");
            });
    }
</script>
