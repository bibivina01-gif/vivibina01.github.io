<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ARCH 사원증 메이커</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&family=Noto+Serif+KR:wght@300;400;700&family=Playfair+Display:wght@700&family=Cinzel:wght@700&family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
<style>
    :root {
        /* 앞면 전용 색상 변수 */
        --bg-color-front: #ffffff;
        --border-color-front: #cfd4db;
        --theme-color-front: #a0a5aa; 
        --logo-color-front: #4a4d52;
        --name-color-front: #111111;
        --rank-color-front: #666666;
        --bottom-text-color-front: #ffffff;

        /* 뒷면 전용 색상 변수 */
        --bg-color-back: #ffffff;
        --border-color-back: #cfd4db;
        --theme-color-back: #a0a5aa; 
        --logo-color-back: #4a4d52;
        --name-color-back: #111111;
        --rank-color-back: #666666;
        --bottom-text-color-back: #ffffff;
    }

    /* 카드 앞면에 변수 매핑 */
    #cardFront {
        --bg-color: var(--bg-color-front);
        --border-color: var(--border-color-front);
        --theme-color: var(--theme-color-front);
        --logo-color: var(--logo-color-front);
        --name-color: var(--name-color-front);
        --rank-color: var(--rank-color-front);
        --bottom-text-color: var(--bottom-text-color-front);
    }

    /* 카드 뒷면에 변수 매핑 */
    #cardBack {
        --bg-color: var(--bg-color-back);
        --border-color: var(--border-color-back);
        --theme-color: var(--theme-color-back);
        --logo-color: var(--logo-color-back);
        --name-color: var(--name-color-back);
        --rank-color: var(--rank-color-back);
        --bottom-text-color: var(--bottom-text-color-back);
    }

    body {
        display: flex;
        flex-direction: row; 
        min-height: 100vh;
        background-color: #e9ecef;
        font-family: 'Noto Sans KR', sans-serif; 
        margin: 0;
        padding: 0; 
    }

    /* 설정 패널 */
    .setup-panel {
        background: white;
        padding: 25px 30px; 
        box-shadow: 2px 0 15px rgba(0,0,0,0.1); 
        width: 520px; 
        height: 100vh; 
        overflow-y: auto; 
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 15px;
        z-index: 10;
    }

    /* 사원증이 보여지는 오른쪽 영역 */
    .canvas-container {
        flex: 1; 
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: auto;
        padding: 20px;
    }

    .control-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .control-group label.title {
        font-size: 14px;
        font-weight: 800;
        color: #333;
    }

    /* 글꼴 & 타입 선택 드롭다운 스타일 */
    select.custom-select {
        padding: 8px;
        border: 1px solid #ced4da;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        font-family: 'Noto Sans KR', sans-serif; 
    }

    /* 색상 설정 4열 배치 */
    .color-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr); 
        gap: 10px;
        background: #f8f9fa;
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #eee;
    }
    
    .color-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
    }
    
    .color-item label {
        font-size: 11px;
        font-weight: bold;
        color: #555;
        white-space: nowrap;
    }

    /* 개별 글씨 선택 스타일 */
    .selectable-text {
        cursor: pointer;
        transition: outline 0.1s;
    }
    .selected-text {
        outline: 2px dashed #0984e3 !important;
        outline-offset: 4px;
        border-radius: 2px;
    }

    /* 텍스트 조절 패널 */
    .text-edit-panel {
        background: #f1f3f5; 
        padding: 15px; 
        border-radius: 8px; 
        margin-top: 5px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .slider-row {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .slider-row span.label {
        font-size: 12px;
        font-weight: bold;
        width: 45px; 
        color: #444;
    }

    .slider-row span.value {
        font-size: 11px;
        width: 30px;
        text-align: right;
        color: #666;
    }

    /* 스티커 조절 패널 */
    .sticker-edit-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px; 
        background: #f8f9fa;
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #eee;
    }

    /* 스티커 버튼 영역 스타일 */
    .sticker-container {
        max-height: 140px; 
        overflow-y: auto; 
        border: 1px solid #dee2e6;
        border-radius: 8px;
        padding: 10px;
        background: #f8f9fa;
    }
    
    .sticker-buttons {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
    }
    .sticker-buttons button, .custom-sticker-label {
        padding: 5px 8px;
        background-color: #ffffff;
        border: 1px solid #ced4da;
        border-radius: 6px;
        font-size: 18px;
        cursor: pointer;
        transition: 0.2s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #333; 
    }
    .sticker-buttons button:hover, .custom-sticker-label:hover {
        background-color: #e2e6ea;
        transform: scale(1.1);
    }
    .custom-sticker-label {
        font-size: 13px;
        font-weight: bold;
        padding: 5px 12px;
    }

    /* 슬라이더 공통 스타일 */
    input[type="range"] {
        flex: 1; 
        cursor: pointer;
    }

    input[type="color"] {
        width: 100%;
        height: 30px; 
        border: none;
        border-radius: 4px;
        padding: 0;
        cursor: pointer;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 1px solid #ddd; border-radius: 4px; }
    
    input[type="file"], button { cursor: pointer; }

    .save-btn {
        padding: 16px;
        background-color: #4a4d52;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        transition: 0.2s;
        margin-top: 15px;
        margin-bottom: 20px;
    }
    .save-btn:hover { background-color: #1a252f; }

    /* 사원증 출력 영역 */
    .print-area {
        display: flex;
        gap: 30px;
        padding: 20px;
        background: transparent;
        position: relative;
    }

    .id-card {
        width: 280px;
        height: 440px;
        background-color: var(--bg-color);
        border-radius: 12px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        display: flex;
        flex-direction: column;
        align-items: center;
        border: 1.5px solid var(--border-color);
        flex-shrink: 0;
    }

    /* 앞면 공통 디자인 요소 */
    .card-face .logo {
        margin-top: 25px;
        font-size: 34px;
        font-weight: 900; 
        color: var(--logo-color);
        letter-spacing: 1px;
    }

    .card-face .photo-wrapper {
        margin-top: 15px;
        width: 170px;
        height: 210px;
        border: 2px solid var(--theme-color-front);
        padding: 3px;
        box-sizing: border-box;
        background-color: var(--bg-color);
        position: relative;
        overflow: hidden;
    }

    .card-face .photo-wrapper img {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #eee;
    }

    .card-face .info-text {
        margin-top: 15px;
        text-align: center;
    }

    .card-face .name {
        font-size: 26px;
        font-weight: 600;
        color: var(--name-color);
        letter-spacing: 5px;
        margin-bottom: 5px;
    }

    .card-face .rank {
        font-size: 14px;
        color: var(--rank-color);
    }

    .card-face .bottom-bar {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 35px;
        background-color: var(--theme-color-front);
        color: var(--bottom-text-color);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 1px;
    }

    /* 뒷면 전용 레이아웃 (타입 1 용 - 왼쪽 바) */
    .back-layout { display: flex; flex-direction: row; width: 100%; height: 100%; }
    .back-layout .side-bar {
        background-color: var(--theme-color-back);
        display: flex;
        justify-content: center;
        align-items: center;
        width: 60px;
    }
    .back-layout .side-text {
        transform: rotate(-90deg);
        white-space: nowrap;
        color: var(--bottom-text-color);
        font-size: 18px; 
        font-weight: 600;
    }
    .back-layout .content {
        flex: 1;
        padding: 40px 20px;
    }
    .back-layout .content .notice {
        color: var(--theme-color-back);
        font-size: 14px; 
        font-weight: bold;
        margin-bottom: 10px;
    }
    .back-layout .content p { font-size: 12px; color: var(--name-color); line-height: 1.8; margin: 0; opacity: 0.8; }

    /* 뒷면 전용 레이아웃 (타입 3 용 - 상단 중앙 바) */
    .back-layout-center {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        align-items: center;
    }
    .back-layout-center .top-bar {
        width: 60px;
        height: 240px; 
        background-color: var(--theme-color-back);
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .back-layout-center .top-text {
        transform: rotate(-90deg);
        white-space: nowrap;
        color: var(--bottom-text-color);
        font-size: 18px; 
        font-weight: 600;
    }
    .back-layout-center .bottom-content {
        width: 100%;
        flex: 1;
        padding: 30px 40px; 
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
    }
    .back-layout-center .bottom-content .notice {
        color: var(--theme-color-back);
        font-size: 14px; 
        font-weight: bold;
        margin-bottom: 10px;
    }
    .back-layout-center .bottom-content p {
        font-size: 12px;
        color: var(--name-color);
        line-height: 1.8;
        margin: 0;
        opacity: 0.8;
    }

    /* ★ 모바일 환경 레이아웃 ★ */
    @media (max-width: 900px) {
        body { 
            flex-direction: column; 
        }
        .setup-panel { 
            width: 100%; 
            height: 42vh; 
            border-bottom: 2px solid #ddd;
            padding: 15px 20px;
        }
        .canvas-container { 
            width: 100%;
            height: 58vh; 
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            overflow: hidden; 
        }
        .print-area { 
            flex-direction: row !important; /* 모바일에서도 무조건 나란히 가로 배치! */
            gap: 15px; 
            transform: scale(0.6); /* 좁은 화면에 두 장을 담기 위한 축소 */
            transform-origin: center center; 
        }
    }
</style>
</head>
<body>

<div class="setup-panel">
    
    <div class="control-group">
        <label class="title">✨ 전체 폰트 및 개별 글씨 설정</label>
        <select id="fontSelect" class="custom-select">
            <option value="'Noto Sans KR', sans-serif" style="font-family: 'Noto Sans KR', sans-serif;">Noto Sans KR (고딕)</option>
            <option value="'Noto Serif KR', serif" style="font-family: 'Noto Serif KR', serif;">Noto Serif KR (명조)</option>
            <option value="'Playfair Display', serif" style="font-family: 'Playfair Display', serif;">Playfair Display</option>
            <option value="'Cinzel', serif" style="font-family: 'Cinzel', serif;">Cinzel</option>
            <option value="'Galmuri9', sans-serif" style="font-family: 'Galmuri9', sans-serif;">Galmuri9 (비트/픽셀)</option>
            <option value="'Jua', sans-serif" style="font-family: 'Jua', sans-serif;">Jua (귀여움 1)</option>
            <option value="'Gaegu', cursive" style="font-family: 'Gaegu', cursive;">Gaegu (귀여움 2)</option>
        </select>
        
        <div class="text-edit-panel">
            <label style="font-size:11px; color:#555;">
                👆 오른쪽 사원증에서 변경할 <b>글씨를 마우스로 클릭</b>하세요!
            </label>
            <div class="slider-row">
                <span class="label">크기</span>
                <input type="range" id="textSizeInput" min="8" max="60" value="14" disabled>
                <span class="value" id="textSizeDisplay">-</span>
            </div>
            <div class="slider-row">
                <span class="label">굵기</span>
                <input type="range" id="textWeightInput" min="100" max="900" step="100" value="400" disabled>
                <span class="value" id="textWeightDisplay">-</span>
            </div>
        </div>
    </div>

    <hr style="border:0; border-top:1px solid #eee;">

    <div class="control-group">
        <label class="title">🔄 뒷면 디자인 타입</label>
        <select id="backTypeSelect" class="custom-select">
            <option value="type-1">타입 1: 기본 (왼쪽 텍스트 바)</option>
            <option value="type-2">타입 2: 윗면과 동일 형태 (사진 별도)</option>
            <option value="type-3">타입 3: 상단 중앙 바 (사진 모양)</option>
        </select>
    </div>

    <hr style="border:0; border-top:1px solid #eee;">

    <div class="control-group">
        <label class="title">📷 사진 올리기</label>
        <div style="display:flex; flex-direction:column; gap:10px; background:#f8f9fa; padding:12px; border-radius:8px; border:1px solid #eee;">
            <div>
                <label style="font-size:12px; font-weight:bold; display:block; margin-bottom:4px;">▶ 앞면 사진</label>
                <input type="file" id="photoInputFront" accept="image/*">
            </div>
            <div id="backPhotoUploadContainer" style="display:none; padding-top:10px; border-top:1px dashed #ccc;">
                <label style="font-size:12px; font-weight:bold; color:#0984e3; display:block; margin-bottom:4px;">▶ 뒷면 사진 (타입 2 전용)</label>
                <input type="file" id="photoInputBack" accept="image/*">
            </div>
        </div>
    </div>

    <hr style="border:0; border-top:1px solid #eee;">

    <div class="control-group">
        <label class="title" style="color:#0984e3;">🎨 앞면 색상 설정</label>
        <div class="color-grid">
            <div class="color-item"><label>바탕</label><input type="color" id="bgColorFront" value="#ffffff"></div>
            <div class="color-item"><label>테두리</label><input type="color" id="borderColorFront" value="#cfd4db"></div>
            <div class="color-item"><label>포인트(바)</label><input type="color" id="themeColorFront" value="#a0a5aa"></div>
            <div class="color-item"><label>로고</label><input type="color" id="logoColorFront" value="#4a4d52"></div>
            <div class="color-item"><label>이름</label><input type="color" id="nameColorFront" value="#111111"></div>
            <div class="color-item"><label>등급</label><input type="color" id="rankColorFront" value="#666666"></div>
            <div class="color-item"><label>바 글씨</label><input type="color" id="bottomTextColorFront" value="#ffffff"></div>
        </div>
    </div>

    <div class="control-group">
        <label class="title" style="color:#d63031;">🎨 뒷면 색상 설정</label>
        <div class="color-grid">
            <div class="color-item"><label>바탕</label><input type="color" id="bgColorBack" value="#ffffff"></div>
            <div class="color-item"><label>테두리</label><input type="color" id="borderColorBack" value="#cfd4db"></div>
            <div class="color-item"><label>포인트(바)</label><input type="color" id="themeColorBack" value="#a0a5aa"></div>
            <div class="color-item"><label>로고(타입2)</label><input type="color" id="logoColorBack" value="#4a4d52"></div>
            <div class="color-item"><label>이름/내용</label><input type="color" id="nameColorBack" value="#111111"></div>
            <div class="color-item"><label>등급(타입2)</label><input type="color" id="rankColorBack" value="#666666"></div>
            <div class="color-item"><label>바 글씨</label><input type="color" id="bottomTextColorBack" value="#ffffff"></div>
        </div>
    </div>
    
    <hr style="border:0; border-top:1px solid #eee;">

    <div class="control-group">
        <label class="title">🚀 스티커 상세 보정</label>
        <div class="sticker-edit-grid">
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <div class="slider-row">
                    <span class="label">통합 크기</span>
                    <input type="range" id="stickerScale" min="10" max="300" value="100">
                </div>
                <div class="slider-row">
                    <span class="label">너비반전</span>
                    <input type="range" id="stickerScaleX" min="-300" max="300" value="100">
                </div>
                <div class="slider-row">
                    <span class="label">높이반전</span>
                    <input type="range" id="stickerScaleY" min="-300" max="300" value="100">
                </div>
                <div class="slider-row">
                    <span class="label">회전각도</span>
                    <input type="range" id="stickerRotate" min="0" max="360" value="0">
                </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <div class="slider-row">
                    <span class="label">밝기</span>
                    <input type="range" id="stickerBrightness" min="0" max="200" value="100">
                </div>
                <div class="slider-row">
                    <span class="label">색상변경</span>
                    <input type="range" id="stickerHue" min="0" max="360" value="0">
                </div>
                <div class="slider-row">
                    <span class="label">투명도</span>
                    <input type="range" id="stickerOpacity" min="20" max="100" value="100">
                </div>
            </div>
        </div>
    </div>

    <div class="control-group" style="margin-top: 10px;">
        <label class="title">✨ 스티커 추가 (클릭 / 드래그 / 더블클릭 삭제)</label>
        <div class="sticker-container">
            <div class="sticker-buttons">
                <label class="custom-sticker-label">
                    + 내 사진 추가
                    <input type="file" id="customStickerInput" accept="image/*" style="display:none;">
                </label>
                <button onclick="addEmojiSticker('🍋')">🍋</button>
                <button onclick="addEmojiSticker('👻')">👻</button>
                <button onclick="addEmojiSticker('💞')">💞</button>
                <button onclick="addEmojiSticker('🐽')">🐽</button>
                <button onclick="addEmojiSticker('🐖')">🐖</button>
                <button onclick="addEmojiSticker('😇')">😇</button>
                <button onclick="addEmojiSticker('💢')">💢</button>
                <button onclick="addEmojiSticker('💘')">💘</button>
                <button onclick="addEmojiSticker('🦴')">🦴</button>
                <button onclick="addEmojiSticker('🗨️')">🗨️</button>
                <button onclick="addEmojiSticker('💋')">💋</button>
                <button onclick="addEmojiSticker('👆')">👆</button>
                <button onclick="addEmojiSticker('🪻')">🪻</button>
                <button onclick="addEmojiSticker('🍰')">🍰</button>
                <button onclick="addEmojiSticker('☁️')">☁️</button>
                <button onclick="addEmojiSticker('🌙')">🌙</button>
                <button onclick="addEmojiSticker('☀️')">☀️</button>
                <button onclick="addEmojiSticker('⚡')">⚡</button>
                <button onclick="addEmojiSticker('❄️')">❄️</button>
                <button onclick="addEmojiSticker('🍊')">🍊</button>
                <button onclick="addEmojiSticker('🍑')">🍑</button>
                <button onclick="addEmojiSticker('🌻')">🌻</button>
                <button onclick="addEmojiSticker('🧀')">🧀</button>
                <button onclick="addEmojiSticker('🍫')">🍫</button>
                <button onclick="addEmojiSticker('🎀')">🎀</button>
                <button onclick="addEmojiSticker('🕶️')">🕶️</button>
                <button onclick="addEmojiSticker('🎵')">🎵</button>
                <button onclick="addEmojiSticker('🧸')">🧸</button>
                <button onclick="addEmojiSticker('🍓')">🍓</button>
                <button onclick="addEmojiSticker('👑')">👑</button>

<div class="canvas-container">
    <div class="print-area" id="idCardSet">
        <div class="id-card card-face" id="cardFront">
            <div class="logo selectable-text">ARCH</div>
            <div class="photo-wrapper">
                <img id="photoPreviewFront" src="" alt="">
            </div>
            <div class="info-text">
                <div class="name selectable-text" contenteditable="true">NOBEL</div>
                <div class="rank selectable-text" contenteditable="true"> S-불속성 센티넬 / 가이드</div>
            </div>
            <div class="bottom-bar selectable-text" contenteditable="true">HARMONY DIV.</div>
        </div>

        <div class="id-card" id="cardBack">
            <div class="back-layout type-1">
                <div class="side-bar">
                    <div class="side-text selectable-text" contenteditable="true">■ Kim cherry mango</div>
                </div>
                <div class="content">
                    <div class="notice selectable-text" contenteditable="true">| 주의사항</div>
                    <p class="selectable-text" contenteditable="true">
                        사원증은 항상 소지해야 합니다.<br>
                        타인에게 양도·대여할 수 없습니다.<br>

</div>

<script>
    const root = document.documentElement.style;
    const printArea = document.getElementById('idCardSet');
    let selectedSticker = null; 
    let selectedText = null; 

    // --- 글꼴 변경 스크립트 ---
    const fontSelect = document.getElementById('fontSelect');
    fontSelect.addEventListener('change', function(e) {
        printArea.style.fontFamily = e.target.value;
        this.style.fontFamily = e.target.value;
    });

    // --- 뒷면 디자인 타입 변경 스크립트 ---
    const backTypeSelect = document.getElementById('backTypeSelect');
    const cardBack = document.getElementById('cardBack');
    const backPhotoUploadContainer = document.getElementById('backPhotoUploadContainer');

    backTypeSelect.addEventListener('change', function(e) {
        const type = e.target.value;
        clearSelections();

        if (type === 'type-1') {
            cardBack.className = 'id-card';
            cardBack.innerHTML = `
                <div class="back-layout type-1">
                    <div class="side-bar">
                        <div class="side-text selectable-text" contenteditable="true">■ Kim cherry mango</div>
                    </div>
                    <div class="content">
                        <div class="notice selectable-text" contenteditable="true">| 주의사항</div>
                        <p class="selectable-text" contenteditable="true">
                            사원증은 항상 소지해야 합니다.<br>
                            타인에게 양도·대여할 수 없습니다.<br>
                            분실 시 재발급을 받아야 합니다.<br><br>
                        </p>
                    </div>
                </div>`;
            backPhotoUploadContainer.style.display = 'none';
        } else if (type === 'type-3') {
            cardBack.className = 'id-card';
            cardBack.innerHTML = `
                <div class="back-layout-center">
                    <div class="top-bar">
                        <div class="top-text selectable-text" contenteditable="true">■ Kim cherry mango</div>
                    </div>
                    <div class="bottom-content">
                        <div class="notice selectable-text" contenteditable="true">| 주의사항</div>
                        <p class="selectable-text" contenteditable="true">
                            사원증은 항상 소지해야 합니다.<br>
                            타인에게 양도·대여할 수 없습니다.<br>
                            분실 시 재발급을 받아야 합니다.<br><br>
                        </p>
                    </div>
                </div>`;
            backPhotoUploadContainer.style.display = 'none';
        } else if (type === 'type-2') {
            cardBack.className = 'id-card card-face';
            cardBack.innerHTML = `
                <div class="logo selectable-text">ARCH</div>
                <div class="photo-wrapper">
                    <img id="photoPreviewBack" src="" alt="">
                </div>
                <div class="info-text">
                    <div class="name selectable-text" contenteditable="true">NOBEL</div>
                    <div class="rank selectable-text" contenteditable="true"> S-불속성 센티넬 / 가이드</div>
                </div>
                <div class="bottom-bar selectable-text" contenteditable="true" style="background-color: var(--theme-color-back);">HARMONY DIV.</div>`;
            backPhotoUploadContainer.style.display = 'block';
            
            const backInput = document.getElementById('photoInputBack');
            if(backInput.files && backInput.files[0]) {
                loadImage(backInput.files[0], 'photoPreviewBack');
            }
        }
    });

    // --- 개별 글씨 크기 및 굵기 조절 스크립트 ---
    const textSizeInput = document.getElementById('textSizeInput');
    const textSizeDisplay = document.getElementById('textSizeDisplay');
    const textWeightInput = document.getElementById('textWeightInput');
    const textWeightDisplay = document.getElementById('textWeightDisplay');

    textSizeInput.addEventListener('input', function(e) {
        if (selectedText) {
            selectedText.style.fontSize = e.target.value + 'px';
            textSizeDisplay.innerText = e.target.value;
        }
    });

    textWeightInput.addEventListener('input', function(e) {
        if (selectedText) {
            selectedText.style.fontWeight = e.target.value;
            textWeightDisplay.innerText = e.target.value;
        }
    });

    function clearSelections() {
        if (selectedSticker) {
            selectedSticker.classList.remove('selected-sticker');
            selectedSticker = null;
        }
        if (selectedText) {
            selectedText.classList.remove('selected-text');
            selectedText = null;
            textSizeInput.disabled = true;
            textWeightInput.disabled = true;
            textSizeDisplay.innerText = '-';
            textWeightDisplay.innerText = '-';
        }
    }

    function updateStickerStyle(sticker) {
        const hue = sticker.dataset.hue || "0";
        const opacity = (sticker.dataset.opacity || "100") / 100;
        const brightness = (sticker.dataset.brightness || "100") / 100;
        const baseScale = (sticker.dataset.scale || "100") / 100;
        const scaleX = (sticker.dataset.scaleX || "100") / 100;
        const scaleY = (sticker.dataset.scaleY || "100") / 100;
        const finalScaleX = baseScale * scaleX;
        const finalScaleY = baseScale * scaleY;
        const rotate = sticker.dataset.rotate || "0";

        sticker.style.filter = `hue-rotate(${hue}deg) opacity(${opacity}) brightness(${brightness})`;
        sticker.style.transform = `rotate(${rotate}deg) scale(${finalScaleX}, ${finalScaleY})`;
    }

    printArea.addEventListener('click', (e) => {
        const clickedSticker = e.target.closest('.drag-sticker');
        const clickedText = e.target.closest('.selectable-text');

        if (selectedSticker && selectedSticker !== clickedSticker) {
            selectedSticker.classList.remove('selected-sticker');
            selectedSticker = null;
        }

        if (selectedText && selectedText !== clickedText) {
            selectedText.classList.remove('selected-text');
            selectedText = null;
            textSizeInput.disabled = true;
            textWeightInput.disabled = true;
            textSizeDisplay.innerText = '-';
            textWeightDisplay.innerText = '-';
        }

        if (clickedSticker) {
            selectedSticker = clickedSticker;
            selectedSticker.classList.add('selected-sticker');

            document.getElementById('stickerScale').value = selectedSticker.dataset.scale || 100;
            document.getElementById('stickerScaleX').value = selectedSticker.dataset.scaleX || 100;
            document.getElementById('stickerScaleY').value = selectedSticker.dataset.scaleY || 100;
            document.getElementById('stickerRotate').value = selectedSticker.dataset.rotate || 0;
            document.getElementById('stickerBrightness').value = selectedSticker.dataset.brightness || 100;
            document.getElementById('stickerHue').value = selectedSticker.dataset.hue || 0;
            document.getElementById('stickerOpacity').value = selectedSticker.dataset.opacity || 100;
            
        } else if (clickedText) {
            selectedText = clickedText;
            selectedText.classList.add('selected-text');
            
            const currentStyle = window.getComputedStyle(selectedText);
            const sizeValue = parseInt(currentStyle.fontSize);
            textSizeInput.value = sizeValue;
            textSizeDisplay.innerText = sizeValue;
            textSizeInput.disabled = false;

            let weightValue = currentStyle.fontWeight;
            if (weightValue === 'bold') weightValue = 700;
            else if (weightValue === 'normal') weightValue = 400;
            else weightValue = parseInt(weightValue) || 400;

            textWeightInput.value = weightValue;
            textWeightDisplay.innerText = weightValue;
            textWeightInput.disabled = false;
        }
    });

    document.getElementById('stickerScale').addEventListener('input', (e) => { if (selectedSticker) { selectedSticker.dataset.scale = e.target.value; updateStickerStyle(selectedSticker); }});
    document.getElementById('stickerScaleX').addEventListener('input', (e) => { if (selectedSticker) { selectedSticker.dataset.scaleX = e.target.value; updateStickerStyle(selectedSticker); }});
    document.getElementById('stickerScaleY').addEventListener('input', (e) => { if (selectedSticker) { selectedSticker.dataset.scaleY = e.target.value; updateStickerStyle(selectedSticker); }});
    document.getElementById('stickerRotate').addEventListener('input', (e) => { if (selectedSticker) { selectedSticker.dataset.rotate = e.target.value; updateStickerStyle(selectedSticker); }});
    document.getElementById('stickerHue').addEventListener('input', (e) => { if (selectedSticker) { selectedSticker.dataset.hue = e.target.value; updateStickerStyle(selectedSticker); }});
    document.getElementById('stickerOpacity').addEventListener('input', (e) => { if (selectedSticker) { selectedSticker.dataset.opacity = e.target.value; updateStickerStyle(selectedSticker); }});
    document.getElementById('stickerBrightness').addEventListener('input', (e) => { if (selectedSticker) { selectedSticker.dataset.brightness = e.target.value; updateStickerStyle(selectedSticker); }});

    function loadImage(file, targetId) {
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = document.getElementById(targetId);
            if(img) {
                img.onload = function() {
                    const wrapperRatio = 164 / 204;
                    const imgRatio = img.naturalWidth / img.naturalHeight;
                    if (imgRatio > wrapperRatio) {
                        img.style.width = 'auto';
                        img.style.height = '100%';
                    } else {
                        img.style.width = '100%';
                        img.style.height = 'auto';
                    }
                };
                img.src = event.target.result;
            }
        }
        reader.readAsDataURL(file);
    }

    document.getElementById('photoInputFront').addEventListener('change', function(e) {
        if(e.target.files[0]) loadImage(e.target.files[0], 'photoPreviewFront');
    });

    document.getElementById('photoInputBack').addEventListener('change', function(e) {
        if(e.target.files[0]) loadImage(e.target.files[0], 'photoPreviewBack');
    });

    const colorInputs = [
        { id: 'bgColorFront', variable: '--bg-color-front' },
        { id: 'borderColorFront', variable: '--border-color-front' },
        { id: 'themeColorFront', variable: '--theme-color-front' }, 
        { id: 'logoColorFront', variable: '--logo-color-front' },
        { id: 'nameColorFront', variable: '--name-color-front' },
        { id: 'rankColorFront', variable: '--rank-color-front' },
        { id: 'bottomTextColorFront', variable: '--bottom-text-color-front' },
        { id: 'bgColorBack', variable: '--bg-color-back' },
        { id: 'borderColorBack', variable: '--border-color-back' },
        { id: 'themeColorBack', variable: '--theme-color-back' },   
        { id: 'logoColorBack', variable: '--logo-color-back' },
        { id: 'nameColorBack', variable: '--name-color-back' },
        { id: 'rankColorBack', variable: '--rank-color-back' },
        { id: 'bottomTextColorBack', variable: '--bottom-text-color-back' }
    ];
    
    colorInputs.forEach(item => {
        const inputElement = document.getElementById(item.id);
        if (inputElement) {
            inputElement.addEventListener('input', (e) => {
                root.setProperty(item.variable, e.target.value);
            });
        }
    });

    function addEmojiSticker(emoji) {
        const sticker = document.createElement('div');
        sticker.className = 'drag-sticker';
        sticker.innerText = emoji;
        sticker.title = "더블클릭하여 삭제";
        sticker.style.left = '100px';
        sticker.style.top = '100px';
        sticker.dataset.scale = "100";
        sticker.dataset.scaleX = "100";
        sticker.dataset.scaleY = "100";
        sticker.dataset.rotate = "0";
        sticker.dataset.hue = "0";
        sticker.dataset.opacity = "100";
        sticker.dataset.brightness = "100";
        updateStickerStyle(sticker);
        sticker.ondblclick = function() { sticker.remove(); };
        printArea.appendChild(sticker);
        makeDraggable(sticker);
    }

    document.getElementById('customStickerInput').addEventListener('change', function(e) {
        if(e.target.files[0]) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const sticker = document.createElement('div');
                sticker.className = 'drag-sticker';
                sticker.title = "더블클릭하여 삭제";
                const img = document.createElement('img');
                img.src = event.target.result;
                sticker.appendChild(img);
                sticker.style.left = '100px';
                sticker.style.top = '100px';
                sticker.dataset.scale = "100";
                sticker.dataset.scaleX = "100";
                sticker.dataset.scaleY = "100";
                sticker.dataset.rotate = "0";
                sticker.dataset.hue = "0";
                sticker.dataset.opacity = "100";
                sticker.dataset.brightness = "100";
                updateStickerStyle(sticker);
                sticker.ondblclick = function() { sticker.remove(); };
                printArea.appendChild(sticker);
                makeDraggable(sticker);
            }
            reader.readAsDataURL(e.target.files[0]);
            e.target.value = ''; 
        }
    });

    function makeDraggable(elmnt) {
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        elmnt.onmousedown = dragMouseDown;
        elmnt.ontouchstart = dragMouseDown; 

        function dragMouseDown(e) {
            e = e || window.event;
            
            if(selectedText) {
                selectedText.classList.remove('selected-text');
                selectedText = null;
                textSizeInput.disabled = true;
                textWeightInput.disabled = true;
                textSizeDisplay.innerText = '-';
                textWeightDisplay.innerText = '-';
            }

            if (selectedSticker && selectedSticker !== elmnt) {
                selectedSticker.classList.remove('selected-sticker');
            }
            selectedSticker = elmnt;
            selectedSticker.classList.add('selected-sticker');

            document.getElementById('stickerScale').value = selectedSticker.dataset.scale || 100;
            document.getElementById('stickerScaleX').value = selectedSticker.dataset.scaleX || 100;
            document.getElementById('stickerScaleY').value = selectedSticker.dataset.scaleY || 100;
            document.getElementById('stickerRotate').value = selectedSticker.dataset.rotate || 0;
            document.getElementById('stickerBrightness').value = selectedSticker.dataset.brightness || 100;
            document.getElementById('stickerHue').value = selectedSticker.dataset.hue || 0;
            document.getElementById('stickerOpacity').value = selectedSticker.dataset.opacity || 100;

            if(e.type === 'touchstart') {
                pos3 = e.touches[0].clientX;
                pos4 = e.touches[0].clientY;
            } else {
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
            }
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
            document.ontouchend = closeDragElement;
            document.ontouchmove = elementDrag;
        }

        function elementDrag(e) {
            e = e || window.event;
            if(e.type !== 'touchmove') e.preventDefault();
            
            let clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
            let clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;

            pos1 = pos3 - clientX;
            pos2 = pos4 - clientY;
            pos3 = clientX;
            pos4 = clientY;
            
            elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
            elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
        }

        function closeDragElement() {
            document.onmouseup = null;
            document.onmousemove = null;
            document.ontouchend = null;
            document.ontouchmove = null;
        }
    }

    // ★ 모바일 저장 오류/화질 저하 및 폰트 풀림 완벽 해결 ★
    function saveCard() {
        clearSelections(); 

        const area = document.getElementById('idCardSet');
        const isMobile = window.innerWidth <= 900;
        const currentFont = document.getElementById('fontSelect').value;
        
        // PC는 그대로 유지 (pixelRatio: 3), 모바일은 초고화질 보장 (pixelRatio: 4)
        // 캡처용 가상 복제본에만 크기 복구(scale(1))와 폰트를 강제 적용하여 폰트 풀림 현상을 완벽히 차단!
        const options = { 
            pixelRatio: isMobile ? 4 : 3, 
            useCORS: true, 
            cacheBust: true,
            style: isMobile ? {
                transform: 'scale(1)',
                transformOrigin: 'top left',
                fontFamily: currentFont // 모바일에서 폰트 깨짐 방지용 강제 주입
            } : {
                fontFamily: currentFont // PC에서도 혹시 모를 버그 방지용 주입
            }
        };

        // 폰트 로드 웜업 및 최종 캡처를 위한 2중 렌더링
        htmlToImage.toPng(area, options)
            .then(function () {
                setTimeout(() => {
                    htmlToImage.toPng(area, options)
                        .then(function (dataUrl) {
                            const link = document.createElement('a');
                            link.download = 'ARCH_사원증.png';
                            link.href = dataUrl;
                            link.click();
                        })
                        .catch(function (error) {
                            alert("저장 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.");
                        });
                }, 200); // 폰트 로딩 대기 시간 확보
            })
            .catch(function (error) {
                alert("이미지 처리 중 오류가 발생했습니다.");
            });
    }
</script>
